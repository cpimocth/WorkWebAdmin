name: CPI FastDB + GitHub Pages

on:
  push:
    paths:
      - '*.xlsx'
      - '**/*.xlsx'
      - 'index.html'
      - 'scripts/build_fastdb.py'
      - '.github/workflows/cpi-fastdb-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cpi-fieldpulse-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout workbook sources
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install efficient Excel XML reader
        run: python -m pip install --disable-pip-version-check lxml==6.0.2

      - name: Build compact monthly FastDB snapshots from Excel
        run: python scripts/build_fastdb.py --root . --out ./fastdb

      - name: Stage website (publish no raw Excel)
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R fastdb _site/fastdb
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
